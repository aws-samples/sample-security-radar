[project]
name = "security-radar"
version = "1.6.20"
license = "MIT-0"
description = "Serverless security incident radar (IT vulns + Web3 hacks) with code-computed verification levels"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12",
  "boto3>=1.43.118",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.23",
  "moto[dynamodb,s3]>=5",
  "ruff==0.17.2",
  "pytest-xdist==3.8.0",
  "pillow>=13.0.0",
]
infra = [
    "aws-cdk-lib>=2.170",
    "cdk-nag>=2.37,<3",
    "constructs>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests", "integrations"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# R6.4: on top of ruff's defaults (which already carry B / BLE / UP / SIM): the bandit set and unused-noqa — a noqa
# that suppresses nothing is a stale exception nobody re-reads
extend-select = ["S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "S310", "S113", "S314"]   # asserts, fixture secrets, local servers, the radar's own XML
"scripts/**" = ["S603", "S607", "S310"]   # operator scripts: fixed commands with list argv (no shell); operator-given URLs
