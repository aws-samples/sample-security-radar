[project]
name = "security-radar"
version = "1.0.0"
license = "MIT-0"
description = "Serverless security incident radar (IT vulns + Web3 hacks) with code-computed verification levels"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12",
  "boto3>=1.43.118",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.23",
  "moto[dynamodb,s3]>=5",
  "ruff==0.17.2",
  "pytest-xdist==3.8.0",
  "pillow>=13.0.0",
]
infra = [
    "aws-cdk-lib>=2.170",
    "cdk-nag>=2.37,<3",
    "constructs>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests", "integrations"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
