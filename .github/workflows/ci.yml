# GitHub Actions run only on milestone tags (v*) or manually — daily CI lives on GitLab
# (github-git-operations iron rule 4: Actions bill per minute). Linux only: nothing here needs Apple SDKs.
name: CI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.4" }
      - run: uv sync --frozen
      - run: uv run ruff check src tests infra scripts integrations
      - run: uv run pytest -q -n auto -p no:cacheprovider

  ui:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run a11y
